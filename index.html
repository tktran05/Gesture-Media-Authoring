<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>3D Scene — Member B</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #1a1a2e; }

    #hud {
      position: fixed;
      top: 16px; left: 16px;
      color: #ccc;
      font: 13px/1.8 monospace;
      background: rgba(0,0,0,0.5);
      padding: 12px 16px;
      border-radius: 8px;
      pointer-events: none;
    }

    #hud .active { color: #00d4aa; font-weight: bold; }
  </style>
</head>
<body>

<div id="hud">
  <div>Select:  <span class="active">1</span> Box &nbsp;
                <span>2</span> Sphere &nbsp;
                <span>3</span> Cone</div>
  <div>Move:    WASD / Arrow keys</div>
  <div>Scale:   + / -</div>
  <div id="selected-label">Selected: Box</div>
</div>

<script type="module">
  import { moveObject, scaleObject, selectObject, box, sphere, cone } from './scene.js';

  // Cập nhật label khi chọn object
  const label = document.getElementById('selected-label');
  const names = { box: 'Box', sphere: 'Sphere', cone: 'Cone (Pyramid)' };

  window.addEventListener('keydown', e => {
    if (e.key === '1') label.textContent = 'Selected: Box';
    if (e.key === '2') label.textContent = 'Selected: Sphere';
    if (e.key === '3') label.textContent = 'Selected: Cone (Pyramid)';
  });
</script>

</body>
</html>
