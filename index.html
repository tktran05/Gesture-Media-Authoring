<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Hệ Mặt Trời 3D - Điều Khiển Cử Chỉ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; position: relative; z-index: 1; }

    /* Webcam toàn màn hình, phía sau scene 3D */
    #webcam {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.25;        /* ← chỉnh độ mờ tại đây (0 = ẩn, 1 = rõ) */
      transform: scaleX(-1); /* mirror cho tự nhiên */
      z-index: 9;
    }

    /* Canvas vẽ landmark bàn tay */
    #overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }

    /* HUD hướng dẫn */
    #hud {
      position: fixed;
      top: 10px;
      left: 10px;
      color: #fff;
      font: 13px monospace;
      background: rgba(0, 0, 0, 0.55);
      padding: 10px 14px;
      border-radius: 8px;
      z-index: 10;
      line-height: 1.8;
    }

    #gesture-label { color: #00d4aa; font-weight: bold; }
  </style>
</head>
<body>

  <div id="hud">
    Trạng thái: <span id="gesture-label">IDLE</span><br/>
    ✋ Lòng bàn tay mở (1 tay) = Xoay scene<br/>
    👌👌 2 tay pinch = Zoom<br/>
    👌 Pinch = Chọn &amp; kéo hành tinh / mặt trời
  </div>

  <video id="webcam" autoplay playsinline></video>
  <canvas id="overlay"></canvas>

  <!-- Toàn bộ logic nằm trong main.js -->
  <script type="module" src="main.js"></script>

</body>
</html>
